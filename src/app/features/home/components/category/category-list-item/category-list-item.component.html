<ion-list class="category-list-item__container">
  
  <ion-item lines="none">

    <ion-label (click)="editCategory.emit()">
      <h2>{{ category.name }}</h2>
      <p>{{ category.created_at | date:'dd/MM/yyyy' }}</p>
    </ion-label>

    <ion-button (click)="deleteCategory()"
      slot="end"
      fill="clear"
      class="icon--delete ">
      <ion-icon name="trash-outline"></ion-icon>
    </ion-button>

  </ion-item>
</ion-list>
