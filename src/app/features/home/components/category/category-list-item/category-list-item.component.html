<ion-list class="ion-margin-bottom">
  <ion-item>

    <ion-label (click)="editCategory.emit()">
      <h2>{{ category.name }}</h2>
      <p>{{ category.created_at | date:'dd/MM/yyyy' }}</p>
    </ion-label>

    <ion-button (click)="deleteCategory()"
      slot="end"
      fill="clear"
      color="danger">
      <ion-icon name="trash-outline"></ion-icon>
    </ion-button>

  </ion-item>
</ion-list>
