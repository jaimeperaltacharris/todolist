<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center">
      Lista de tareas
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true"
  class="ion-padding"
  fixed-slot-placement="before">

  <ion-item class="ion-margin-bottom">
    <ion-label>Filtrar por categoría</ion-label>

    <ion-select [(ngModel)]="selectedCategory"
      interface="action-sheet"
      (ionChange)="onCategoryChange()">

      <ion-select-option value="all">Todas</ion-select-option>
      @for(cat of categories; track cat.id) {
        <ion-select-option
          [value]="cat.id">
          {{ cat.name }}
        </ion-select-option>
      }

    </ion-select>
  </ion-item>

  @for (task of tasks; track task.id) {
    <app-task-item [task]="task"
      (statusUpdated)="updateTaskStatus(task)"
      (editTask)="openEditModal(task)"
      (taskDeleted)="removeTaskFromArray(task)"></app-task-item>
  }

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button id="actions-trigger">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>

<ion-popover #popoverActions
  trigger="actions-trigger"
  triggerAction="actions"
  side="top">

  <ng-template>
    <ion-content class="ion-no-padding">

      <ion-button (click)="isCategoryModalOpen = true; closePopover()"
        expand="block"
        aria-label="category"
        class="btn--action">
        <ion-icon class="mr--05" name="filter-circle-outline" aria-hidden="true"></ion-icon>
        Mis categorías
      </ion-button>

      <ion-button (click)="isCreateModalOpen = true; closePopover()"
        aria-label="task"
        expand="block"
        class="btn--action">
        <ion-icon class="mr--05" name="document-text-outline" aria-hidden="true"></ion-icon>
        Nueva Tarea
      </ion-button>

    </ion-content>
  </ng-template>
</ion-popover>

<ion-modal [isOpen]="isCategoryModalOpen">
  <ng-template>
    <app-category-list-modal (needReloadTasks)="validateCategoryAction($event)"></app-category-list-modal>
  </ng-template>
</ion-modal>

<ion-modal [isOpen]="isCreateModalOpen">
  <ng-template>
    <app-create-task-modal (needReloadTasks)="validateCategoryAction($event)"></app-create-task-modal>
  </ng-template>
</ion-modal>

<ion-modal [isOpen]="isEditOpen">
  <ng-template>
    <app-edit-task-modal [task]="taskToEdit"
      (editTask)="editTaskInfo($event)"></app-edit-task-modal>
  </ng-template>
</ion-modal>
